<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8" />
        <title>Sistema de Gestión Hotelera - Habitaciones</title>
        <!-- Bootstrap 5 CSS -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    </head>
    <body class="bg-light">
        <!-- Navegación Principal -->
        <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
            <div class="container-fluid">
                <a class="navbar-brand fw-bold" href="#">Cadena Hotelera</a>
                <div class="collapse navbar-collapse">
                    <ul class="navbar-nav me-auto">
                        <li class="nav-item"><a class="nav-link" href="/">Inicio</a></li>
                        <li class="nav-item"><a class="nav-link" href="/hoteles">Hoteles</a></li>
                        <li class="nav-item"><a class="nav-link" href="/tipos">Tipos Habitación</a></li>
                        <li class="nav-item"><a class="nav-link active" href="#">Habitaciones</a></li>
                        <li class="nav-item"><a class="nav-link" href="/consultas">Consultas</a></li>
                    </ul>
                </div>
            </div>
        </nav>
        <div class="container">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h3 class="text-secondary">Gestión de Habitaciones</h3>
                <button class="btn btn-primary" onclick="abrirModalCrear()">+ Nueva Habitación</button>
            </div>

            <div id="alertaError" class="alert alert-danger d-none" role="alert"></div>

            <div id="alertaExito" class="alert alert-success alert-dismissible fade show d-none" role="alert">
                <span id="mensajeExito"></span>
                <button type="button" class="btn-close" onclick="cerrarAlertaExito()"></button>
            </div>

            <div class="card shadow-sm">
                <div class="card-body">
                    <table class="table table-hover align-middle">
                        <thead class="table-dark">
                            <tr>
                                <th>ID</th>
                                <th>Hotel</th>
                                <th>Número</th>
                                <th>Piso</th>
                                <th>Tipo</th>
                                <th>Estado</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="cuerpoTablaHabitaciones">
                            <tr>
                                <td colspan="7" class="text-center text-muted">Cargando habitaciones...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Modal Formulario Habitación -->
        <div class="modal fade" id="modalHabitacion" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header bg-primary text-white">
                        <h5 class="modal-title" id="modalHabitacionTitulo">Guardar Habitación</h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <form id="formHabitacion">
                            <input type="hidden" id="habitacionId" />

                            <div class="mb-3">
                                <label class="form-label">Hotel *</label>
                                <select id="selectHotel" class="form-select" required>
                                    <option value="">Seleccione un Hotel...</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Tipo de Habitación *</label>
                                <select id="selectTipo" class="form-select" required>
                                    <option value="">Seleccione un Tipo...</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Número de Habitación *</label>
                                <input type="text" id="numero" class="form-control" placeholder="Ej: 101" required />
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Piso *</label>
                                <input type="number" id="piso" class="form-control" min="1" required />
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Estado *</label>
                                <select id="selectEstado" class="form-select" required>
                                    <option value="Disponible">Disponible</option>
                                    <option value="Mantenimiento">Mantenimiento</option>
                                    <option value="Ocupado">Ocupado</option>
                                </select>
                            </div>
                        </form>
                        <div id="alertaModal" class="alert alert-danger d-none"></div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="button" class="btn btn-primary" onclick="guardarHabitacion()">Guardar</button>
                    </div>
                </div>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        <script>
            let modalBs;

            document.addEventListener("DOMContentLoaded", () => {
                modalBs = new bootstrap.Modal(document.getElementById("modalHabitacion"));
                cargarHotelesYTipos();
                cargarHabitaciones();
            });

            function cargarHotelesYTipos() {
                // Cargar Hoteles para el select
                fetch("/api/hoteles")
                    .then(res => res.json())
                    .then(data => {
                        const sel = document.getElementById("selectHotel");
                        sel.innerHTML = '<option value="">Seleccione un Hotel...</option>';
                        data.forEach(h => {
                            sel.innerHTML += `<option value="${h.id_hotel}">${h.nombre}</option>`;
                        });
                    });

                // Cargar Tipos para el select
                fetch("/api/tipo")
                    .then(res => res.json())
                    .then(data => {
                        const sel = document.getElementById("selectTipo");
                        sel.innerHTML = '<option value="">Seleccione un Tipo...</option>';
                        data.forEach(t => {
                            sel.innerHTML += `<option value="${t.id_tipo}">${t.nombre} (Cap: ${t.capacidad})</option>`;
                        });
                    });
            }

            function cargarHabitaciones() {
                fetch("/api/habitaciones")
                    .then(res => res.json())
                    .then(data => {
                        const cuerpo = document.getElementById("cuerpoTablaHabitaciones");
                        cuerpo.innerHTML = "";
                        if (data.length === 0) {
                            cuerpo.innerHTML =
                                '<tr><td colspan="7" class="text-center text-muted">No existen habitaciones registradas.</td></tr>';
                            return;
                        }
                        data.forEach(hab => {
                            let badgeClass = "bg-secondary";
                            if (hab.estado === "Disponible") badgeClass = "bg-success";
                            if (hab.estado === "Mantenimiento") badgeClass = "bg-warning text-dark";
                            if (hab.estado === "Ocupado") badgeClass = "bg-danger";

                            cuerpo.innerHTML += `
                            <tr>
                                <td>${hab.id_habitacion}</td>
                                <td>${hab.hotel ? hab.hotel.nombre : "N/A"}</td>
                                <td><strong>${hab.numero}</strong></td>
                                <td>Piso ${hab.piso}</td>
                                <td>${hab.tipo ? hab.tipo.nombre : "N/A"}</td>
                                <td><span class="badge ${badgeClass}">${hab.estado}</span></td>
                                <td>
                                    <button class="btn btn-sm btn-warning me-1" onclick="editarHabitacion(${hab.id_habitacion})">Editar</button>
                                    <button class="btn btn-sm btn-danger" onclick="eliminarHabitacion(${hab.id_habitacion})">Eliminar</button>
                                </td>
                            </tr>`;
                        });
                    });
            }

            function abrirModalCrear() {
                document.getElementById("formHabitacion").reset();
                document.getElementById("habitacionId").value = "";
                document.getElementById("modalHabitacionTitulo").innerText = "Nueva Habitación";
                document.getElementById("alertaModal").classList.add("d-none");
                modalBs.show();
            }

            function editarHabitacion(id) {
                fetch(`/api/habitaciones/${id}`)
                    .then(res => res.json())
                    .then(hab => {
                        document.getElementById("habitacionId").value = hab.id_habitacion;
                        document.getElementById("selectHotel").value = hab.hotel ? hab.hotel.id_hotel : "";
                        document.getElementById("selectTipo").value = hab.tipo ? hab.tipo.id_tipo : "";
                        document.getElementById("numero").value = hab.numero;
                        document.getElementById("piso").value = hab.piso;
                        document.getElementById("selectEstado").value = hab.estado;
                        document.getElementById("modalHabitacionTitulo").innerText = "Editar Habitación";
                        document.getElementById("alertaModal").classList.add("d-none");
                        modalBs.show();
                    });
            }

            function mostrarExito(mensaje) {
                const alerta = document.getElementById("alertaExito");
                document.getElementById("mensajeExito").innerText = mensaje;
                alerta.classList.remove("d-none");
                setTimeout(() => alerta.classList.add("d-none"), 4000);
            }

            function cerrarAlertaExito() {
                document.getElementById("alertaExito").classList.add("d-none");
            }

            function guardarHabitacion() {
                const id = document.getElementById("habitacionId").value;
                const id_hotel = document.getElementById("selectHotel").value;
                const id_tipo = document.getElementById("selectTipo").value;
                const numero = document.getElementById("numero").value.trim();
                const piso = parseInt(document.getElementById("piso").value);
                const estado = document.getElementById("selectEstado").value;
                const alerta = document.getElementById("alertaModal");

                alerta.classList.add("d-none");

                if (!id_hotel || !id_tipo || !numero || isNaN(piso)) {
                    alerta.innerText = "Captura todos los campos obligatorios.";
                    alerta.classList.remove("d-none");
                    return;
                }

                if (piso <= 0) {
                    alerta.innerText = "El número de piso debe ser un entero positivo.";
                    alerta.classList.remove("d-none");
                    return;
                }

                const payload = {
                    numero: numero,
                    piso: piso,
                    estado: estado,
                    hotel: { id_hotel: parseInt(id_hotel) },
                    tipo: { id_tipo: parseInt(id_tipo) },
                };

                const url = id ? `/api/habitaciones/actualizar/${id}` : "/api/habitaciones/guardar";
                const mensajeOk = id ? "Habitación actualizada con éxito." : "Habitación registrada con éxito.";

                fetch(url, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload),
                })
                    .then(res => {
                        if (!res.ok)
                            throw new Error(
                                "No se pudo guardar la habitación. Verifica que el número no esté duplicado en el mismo hotel.",
                            );
                        return res.json();
                    })
                    .then(() => {
                        modalBs.hide();
                        cargarHabitaciones();
                        mostrarExito(mensajeOk);
                    })
                    .catch(err => {
                        alerta.innerText = err.message;
                        alerta.classList.remove("d-none");
                    });
            }

            function eliminarHabitacion(id) {
                if (!confirm("¿Desea eliminar esta habitación?")) return;

                fetch(`/api/habitaciones/eliminar/${id}`, { method: "DELETE" })
                    .then(res => {
                        if (res.status === 204) {
                            cargarHabitaciones();
                            mostrarExito("Habitación eliminada con éxito.");
                        } else {
                            throw new Error("Ocurrió un error al intentar eliminar la habitación.");
                        }
                    })
                    .catch(err => {
                        const alertaPrincipal = document.getElementById("alertaError");
                        alertaPrincipal.innerText = err.message;
                        alertaPrincipal.classList.remove("d-none");
                        setTimeout(() => alertaPrincipal.classList.add("d-none"), 5000);
                    });
            }
        </script>
    </body>
</html>
