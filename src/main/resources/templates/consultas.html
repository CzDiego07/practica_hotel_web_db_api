<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8" />
        <title>Sistema de Gestión Hotelera - Consultas</title>
        <!-- Bootstrap 5 CSS -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    </head>
    <body class="bg-light">
        <!-- Navegación Principal -->
        <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
            <div class="container-fluid">
                <a class="navbar-brand fw-bold" href="#">Cadena Hotelera</a>
                <div class="collapse navbar-collapse">
                    <ul class="navbar-nav me-auto">
                        <li class="nav-item"><a class="nav-link" href="/">Inicio</a></li>
                        <li class="nav-item"><a class="nav-link" href="/hoteles">Hoteles</a></li>
                        <li class="nav-item"><a class="nav-link" href="/tipos">Tipos Habitación</a></li>
                        <li class="nav-item"><a class="nav-link" href="/habitaciones">Habitaciones</a></li>
                        <li class="nav-item"><a class="nav-link active" href="#">Consultas</a></li>
                    </ul>
                </div>
            </div>
        </nav>

        <div class="container">
            <h3 class="mb-3 text-secondary">Panel de Consultas</h3>

            <!-- Pestañas de Consultas -->
            <ul class="nav nav-pills mb-3" id="pills-tab">
                <li class="nav-item me-2">
                    <button
                        class="nav-link btn-tab"
                        onclick="
                            seleccionarPestana(this);
                            cargarDisponibles();
                        "
                    >
                        1. Hab. Disponibles
                    </button>
                </li>
                <li class="nav-item me-2">
                    <button
                        class="nav-link btn-tab"
                        onclick="
                            seleccionarPestana(this);
                            cargarOferta(false);
                        "
                    >
                        2. Oferta Global
                    </button>
                </li>
                <li class="nav-item me-2">
                    <button
                        class="nav-link btn-tab"
                        onclick="
                            seleccionarPestana(this);
                            cargarOferta(true);
                        "
                    >
                        3. Oferta Solo Disponibles
                    </button>
                </li>
                <li class="nav-item me-2">
                    <button
                        class="nav-link btn-tab"
                        onclick="
                            seleccionarPestana(this);
                            cargarCantidadPorTipo();
                        "
                    >
                        4. Cantidad por Tipo
                    </button>
                </li>
                <li class="nav-item me-2">
                    <button
                        class="nav-link btn-tab"
                        onclick="
                            seleccionarPestana(this);
                            mostrarFiltroRango();
                            limpiar();
                        "
                    >
                        5. Filtrar por Precio
                    </button>
                </li>
            </ul>

            <!-- Panel de Filtro de Rango de Precio (Oculto por defecto) -->
            <div id="panelRango" class="card card-body mb-3 d-none">
                <div class="row g-3 align-items-center">
                    <div class="col-auto">
                        <label class="col-form-label">Mínimo ($):</label>
                        <input type="number" id="precioMin" class="form-control" value="500" min="0" step="0.01" />
                    </div>
                    <div class="col-auto">
                        <label class="col-form-label">Máximo ($):</label>
                        <input type="number" id="precioMax" class="form-control" value="2500" min="0" step="0.01" />
                    </div>
                    <div class="col-auto align-self-end">
                        <button class="btn btn-success" onclick="consultarPorRango()">Filtrar</button>
                    </div>
                </div>
                <!-- Alerta de validación de JavaScript -->
                <div id="alertaErrorRango" class="alert alert-danger mt-3 d-none" role="alert"></div>
            </div>

            <!-- Tabla de Resultados -->
            <div class="card shadow-sm">
                <div class="card-body">
                    <table class="table table-hover align-middle" id="tablaResultados">
                        <thead class="table-dark">
                            <tr id="encabezadoTabla">
                                <th colspan="4" class="text-center text-light">
                                    Seleccione una opcion para cargar los datos...
                                </th>
                            </tr>
                        </thead>
                        <tbody id="cuerpoTabla">
                            <tr>
                                <td colspan="4" class="text-center text-muted">...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- JavaScript para consumir las API REST -->
        <script>
            function limpiar() {
                const encabezado = document.getElementById("encabezadoTabla");
                const cuerpo = document.getElementById("cuerpoTabla");

                // Limpiar contenido previo
                encabezado.innerHTML = "";
                cuerpo.innerHTML = "";
            }
            // Función universal para renderizar cualquier JSON en una tabla HTML
            function renderizarTablaDinamica(data) {
                const encabezado = document.getElementById("encabezadoTabla");
                const cuerpo = document.getElementById("cuerpoTabla");

                // Limpiar contenido previo
                encabezado.innerHTML = "";
                cuerpo.innerHTML = "";

                // Validar si el JSON viene vacío
                if (!data || data.length === 0) {
                    cuerpo.innerHTML = `
            <tr>
                <td colspan="100%" class="text-center text-muted p-4">
                    No se encontraron registros para esta consulta.
                </td>
            </tr>`;
                    return;
                }

                // 1. Obtener las llaves (columnas) del primer objeto JSON
                const columnas = Object.keys(data[0]);

                // 2. Generar dinámicamente los <th> del encabezado
                let htmlEncabezado = "";
                columnas.forEach(col => {
                    // Formatea camelCase a palabras legibles (ej: nombreHotel -> Nombre Hotel)
                    let nombreFormateado = col.replace(/([A-Z])/g, " $1").replace(/^./, str => str.toUpperCase());

                    htmlEncabezado += `<th>${nombreFormateado}</th>`;
                });
                encabezado.innerHTML = `<tr>${htmlEncabezado}</tr>`;

                // 3. Generar dinámicamente las filas <tr> y celdas <td>
                data.forEach(item => {
                    let htmlFila = "<tr>";
                    columnas.forEach(col => {
                        let valor = item[col];

                        // Tratamiento especial para formato visual (opcional)
                        if (valor === null || valor === undefined) {
                            valor = '<span class="text-muted">N/A</span>';
                        } else if (typeof valor === "boolean") {
                            valor = valor
                                ? '<span class="badge bg-success">Activo</span>'
                                : '<span class="badge bg-danger">Inactivo</span>';
                        } else if (col.toLowerCase().includes("precio")) {
                            valor = `$${Number(valor).toFixed(2)}`;
                        } else if (col.toLowerCase().includes("estado")) {
                            let badgeClass = "bg-secondary";
                            if (valor === "Disponible") badgeClass = "bg-success";
                            if (valor === "Mantenimiento") badgeClass = "bg-warning text-dark";
                            if (valor === "Ocupado") badgeClass = "bg-danger";
                            valor = `<span class="badge ${badgeClass}">${valor}</span>`;
                        }

                        htmlFila += `<td>${valor}</td>`;
                    });
                    htmlFila += "</tr>";
                    cuerpo.innerHTML += htmlFila;
                });
            }
            // Historia 1: Habitaciones Disponibles
            function cargarDisponibles() {
                ocultarFiltro();
                fetch("/api/consultas/habitacion/disponible")
                    .then(res => res.json())
                    .then(data => renderizarTablaDinamica(data));
            }
            // Historia 2 / 3: Oferta de habitaciones
            function cargarOferta(soloDisponibles) {
                ocultarFiltro();
                const url = soloDisponibles ? "/api/consultas/oferta/disponibles" : "/api/consultas/oferta";

                fetch(url)
                    .then(res => res.json())
                    .then(data => renderizarTablaDinamica(data));
            }

            // Historia 4: Cantidad por tipo
            function cargarCantidadPorTipo() {
                ocultarFiltro();
                fetch("/api/consultas/cantidad")
                    .then(res => res.json())
                    .then(data => renderizarTablaDinamica(data));
            }

            // Historia 5: Filtrar por rango de precio
            function consultarPorRango() {
                const inputMin = document.getElementById("precioMin");
                const inputMax = document.getElementById("precioMax");
                const alerta = document.getElementById("alertaErrorRango");

                // Ocultar alerta previa
                alerta.classList.add("d-none");
                alerta.innerText = "";

                const min = parseFloat(inputMin.value);
                const max = parseFloat(inputMax.value);

                // 1. Validar que no estén vacíos o sean NaN
                if (isNaN(min) || isNaN(max)) {
                    alerta.innerText = "Por favor, ingresa un precio mínimo y máximo válidos.";
                    alerta.classList.remove("d-none");
                    return;
                }

                // 2. Validar valores negativos
                if (min < 0 || max < 0) {
                    alerta.innerText = "Los precios no pueden ser valores negativos.";
                    alerta.classList.remove("d-none");
                    return;
                }

                // 3. Validar la restricción: Mínimo no puede ser mayor que Máximo
                if (min > max) {
                    alerta.innerText =
                        "El precio mínimo no puede ser mayor que el precio máximo ($" + min + " > $" + max + ").";
                    alerta.classList.remove("d-none");
                    return;
                }

                // Si pasa todas las validaciones, realiza la consulta a la API
                fetch(`/api/consultas/rangoPrecio?min=${min}&max=${max}`)
                    .then(res => {
                        if (!res.ok) {
                            return res.text().then(text => {
                                throw new Error(text);
                            });
                        }
                        return res.json();
                    })
                    .then(data => renderizarTablaDinamica(data))
                    .catch(err => {
                        alerta.innerText = err.message || "Error al realizar la consulta.";
                        alerta.classList.remove("d-none");
                    });
            }
            function mostrarFiltroRango() {
                document.getElementById("panelRango").classList.remove("d-none");
            }

            function ocultarFiltro() {
                document.getElementById("panelRango").classList.add("d-none");
            }
            // Función para cambiar el estado visual de la pestaña seleccionada
            function seleccionarPestana(elemento) {
                // 1. Seleccionar todos los botones con la clase 'btn-tab'
                const pestanas = document.querySelectorAll(".btn-tab");

                // 2. Remover la clase 'active' de todas las pestañas
                pestanas.forEach(p => p.classList.remove("active"));

                // 3. Agregar la clase 'active' únicamente al botón presionado
                elemento.classList.add("active");
            }
        </script>
    </body>
</html>
