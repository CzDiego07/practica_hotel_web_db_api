<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8" />
        <title>Sistema de Gestión Hotelera - Hoteles</title>
        <!-- Bootstrap 5 CSS -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    </head>
    <body class="bg-light">
        <!-- Navegación Principal -->
        <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
            <div class="container-fluid">
                <a class="navbar-brand fw-bold" href="#">Cadena Hotelera</a>
                <div class="collapse navbar-collapse">
                    <ul class="navbar-nav me-auto">
                        <li class="nav-item"><a class="nav-link" href="/">Inicio</a></li>
                        <li class="nav-item"><a class="nav-link active" href="#">Hoteles</a></li>
                        <li class="nav-item"><a class="nav-link" href="/tipos">Tipos Habitación</a></li>
                        <li class="nav-item"><a class="nav-link" href="/habitaciones">Habitaciones</a></li>
                        <li class="nav-item"><a class="nav-link" href="/consultas">Consultas</a></li>
                    </ul>
                </div>
            </div>
        </nav>
        <div class="container">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h3 class="text-secondary">Gestión de Hoteles</h3>
                <button class="btn btn-primary" onclick="abrirModalCrear()">+ Nuevo Hotel</button>
            </div>

            <div id="alertaError" class="alert alert-danger d-none" role="alert"></div>

            <div id="alertaExito" class="alert alert-success alert-dismissible fade show d-none" role="alert">
                <span id="mensajeExito"></span>
                <button type="button" class="btn-close" onclick="cerrarAlertaExito()"></button>
            </div>
            <!-- Tabla de Hoteles -->
            <div class="card shadow-sm">
                <div class="card-body">
                    <table class="table table-hover align-middle">
                        <thead class="table-dark">
                            <tr>
                                <th>ID</th>
                                <th>Nombre</th>
                                <th>Dirección</th>
                                <th>Ciudad</th>
                                <th>Teléfono</th>
                                <th>Email</th>
                                <th>Estado</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="cuerpoTablaHoteles">
                            <tr>
                                <td colspan="8" class="text-center text-muted">Cargando hoteles...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Modal Formulario Hotel -->
        <div class="modal fade" id="modalHotel" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header bg-primary text-white">
                        <h5 class="modal-title" id="modalHotelTitulo">Guardar Hotel</h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <form id="formHotel">
                            <input type="hidden" id="hotelId" />
                            <div class="mb-3">
                                <label class="form-label">Nombre *</label>
                                <input type="text" id="nombre" class="form-control" required />
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Dirección *</label>
                                <input type="text" id="direccion" class="form-control" required />
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Ciudad *</label>
                                <input type="text" id="ciudad" class="form-control" required />
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Teléfono (10 dígitos) *</label>
                                <input type="text" id="telefono" class="form-control" maxlength="10" required />
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Correo Electrónico *</label>
                                <input type="email" id="email" class="form-control" required />
                            </div>
                            <div class="form-check mb-3">
                                <input class="form-check-input" type="checkbox" id="activo" checked />
                                <label class="form-check-label" for="activo">Hotel Activo para Operar</label>
                            </div>
                        </form>
                        <div id="alertaModal" class="alert alert-danger d-none"></div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="button" class="btn btn-primary" onclick="guardarHotel()">Guardar</button>
                    </div>
                </div>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        <script>
            let modalBs;

            document.addEventListener("DOMContentLoaded", () => {
                modalBs = new bootstrap.Modal(document.getElementById("modalHotel"));
                cargarHoteles();
            });

            function cargarHoteles() {
                fetch("/api/hoteles")
                    .then(res => res.json())
                    .then(data => {
                        const cuerpo = document.getElementById("cuerpoTablaHoteles");
                        cuerpo.innerHTML = "";
                        if (data.length === 0) {
                            cuerpo.innerHTML =
                                '<tr><td colspan="8" class="text-center text-muted">No hay hoteles registrados.</td></tr>';
                            return;
                        }
                        data.forEach(h => {
                            cuerpo.innerHTML += `
                            <tr>
                                <td>${h.id_hotel}</td>
                                <td><strong>${h.nombre}</strong></td>
                                <td>${h.direccion}</td>
                                <td>${h.ciudad}</td>
                                <td>${h.telefono}</td>
                                <td>${h.email}</td>
                                <td>${
                                    h.activo
                                        ? '<span class="badge bg-success">Activo</span>'
                                        : '<span class="badge bg-danger">Inactivo</span>'
                                }</td>
                                <td>
                                    <button class="btn btn-sm btn-warning me-1" onclick="editarHotel(${h.id_hotel})">Editar</button>
                                    <button class="btn btn-sm btn-danger" onclick="eliminarHotel(${h.id_hotel})">Eliminar</button>
                                </td>
                            </tr>`;
                        });
                    });
            }

            function abrirModalCrear() {
                document.getElementById("formHotel").reset();
                document.getElementById("hotelId").value = "";
                document.getElementById("activo").checked = true;
                document.getElementById("modalHotelTitulo").innerText = "Nuevo Hotel";
                document.getElementById("alertaModal").classList.add("d-none");
                modalBs.show();
            }

            function editarHotel(id) {
                fetch(`/api/hoteles/${id}`)
                    .then(res => res.json())
                    .then(h => {
                        document.getElementById("hotelId").value = h.id_hotel;
                        document.getElementById("nombre").value = h.nombre;
                        document.getElementById("direccion").value = h.direccion;
                        document.getElementById("ciudad").value = h.ciudad;
                        document.getElementById("telefono").value = h.telefono;
                        document.getElementById("email").value = h.email;
                        document.getElementById("activo").checked = h.activo;
                        document.getElementById("modalHotelTitulo").innerText = "Editar Hotel";
                        document.getElementById("alertaModal").classList.add("d-none");
                        modalBs.show();
                    });
            }

            function mostrarExito(mensaje) {
                const alerta = document.getElementById("alertaExito");
                document.getElementById("mensajeExito").innerText = mensaje;
                alerta.classList.remove("d-none");
                setTimeout(() => alerta.classList.add("d-none"), 4000);
            }

            function cerrarAlertaExito() {
                document.getElementById("alertaExito").classList.add("d-none");
            }
            function guardarHotel() {
                const id = document.getElementById("hotelId").value;
                const nombre = document.getElementById("nombre").value.trim();
                const direccion = document.getElementById("direccion").value.trim();
                const ciudad = document.getElementById("ciudad").value.trim();
                const telefono = document.getElementById("telefono").value.trim();
                const email = document.getElementById("email").value.trim();
                const activo = document.getElementById("activo").checked;
                const alerta = document.getElementById("alertaModal");

                alerta.classList.add("d-none");

                if (!nombre || !direccion || !ciudad || !telefono || !email) {
                    alerta.innerText = "Todos los campos obligatorios deben ser capturados.";
                    alerta.classList.remove("d-none");
                    return;
                }

                const regexEmail = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                if (!regexEmail.test(email)) {
                    alerta.innerText = "Por favor, ingresa un correo electrónico válido.";
                    alerta.classList.remove("d-none");
                    return;
                }

                if (telefono.length < 8 || isNaN(telefono)) {
                    alerta.innerText = "Ingresa un número de teléfono válido (solo dígitos).";
                    alerta.classList.remove("d-none");
                    return;
                }

                const payload = { nombre, direccion, ciudad, telefono, email, activo };
                const url = id ? `/api/hoteles/actualizar/${id}` : "/api/hoteles/guardar";
                const mensajeOk = id ? "Hotel actualizado con éxito." : "Hotel registrado con éxito.";

                fetch(url, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload),
                })
                    .then(res => {
                        if (!res.ok) throw new Error("Error al procesar la solicitud.");
                        return res.json();
                    })
                    .then(() => {
                        modalBs.hide();
                        cargarHoteles();
                        mostrarExito(mensajeOk);
                    })
                    .catch(err => {
                        alerta.innerText = err.message;
                        alerta.classList.remove("d-none");
                    });
            }

            function eliminarHotel(id) {
                if (
                    !confirm(
                        "¿Está seguro de eliminar este hotel? Si tiene habitaciones asociadas la operación podría fallar.",
                    )
                )
                    return;

                fetch(`/api/hoteles/eliminar/${id}`, { method: "DELETE" })
                    .then(res => {
                        if (res.status === 204) {
                            cargarHoteles();
                            mostrarExito("Hotel eliminado con éxito.");
                        } else {
                            throw new Error(
                                "No se puede eliminar el hotel porque tiene habitaciones o registros vinculados.",
                            );
                        }
                    })
                    .catch(err => {
                        const alertaPrincipal = document.getElementById("alertaError");
                        alertaPrincipal.innerText = err.message;
                        alertaPrincipal.classList.remove("d-none");
                        setTimeout(() => alertaPrincipal.classList.add("d-none"), 5000);
                    });
            }
        </script>
    </body>
</html>
